[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant-lab"
version = "0.1.0"
description = "Учебный персональный ассистент с собственным агентным циклом"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["assistant_lab*", "study_planner*"]

[tool.setuptools.package-data]
assistant_lab = ["skill_library/*/SKILL.md"]
study_planner = ["views/*/view.json", "views/*/report.md"]
